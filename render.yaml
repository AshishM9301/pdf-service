# Render blueprint for PDF service
# Deploy with: render blueprints apply

services:
  - type: web
    name: pdf-service
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_NO_SANDBOX
        value: "1"
      - key: PUPPETEER_NO_CHROMIUM_DOWNLOAD
        value: "1"