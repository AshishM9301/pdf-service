# Render blueprint for PDF service
# Deploy with: render blueprints apply

services:
  - type: web
    name: pdf-server
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PDF_SERVICE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: pdf-worker
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_NO_SANDBOX
        value: "1"
      - key: PUPPETEER_NO_CHROMIUM_DOWNLOAD
        value: "1"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false